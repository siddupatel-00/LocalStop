<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LocalStop preview</title>
  <link rel="stylesheet" href="../tauri/src/styles.css" />
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f6f6;
      --bg-elevated: #ffffff;
      --fg: #0a0a0a;
      --fg-secondary: #5c5c5c;
      --fg-muted: #8e8e8e;
      --border: rgba(0, 0, 0, 0.14);
      --border-strong: rgba(0, 0, 0, 0.24);
      --row-bg: #ffffff;
      --row-hover: #f2f2f2;
      --row-border: rgba(0, 0, 0, 0.09);
      --row-border-hover: rgba(0, 0, 0, 0.16);
      --row-shadow: 0 1px 2px rgba(0, 0, 0, 0.03);
      --field-bg: rgba(0, 0, 0, 0.045);
      --field-hover: rgba(0, 0, 0, 0.08);
      --field-focus: #ffffff;
      --badge-bg: rgba(0, 0, 0, 0.06);
      --icon-bg: rgba(0, 0, 0, 0.05);
      --icon-bg-hover: rgba(0, 0, 0, 0.1);
      --icon-bg-active: rgba(0, 0, 0, 0.16);
      --accent: #0a0a0a;
      --focus: rgba(0, 0, 0, 0.85);
      --focus-ring: rgba(0, 0, 0, 0.12);
      --danger: #0a0a0a;
      --danger-bg: rgba(0, 0, 0, 0.08);
      --danger-bg-hover: rgba(0, 0, 0, 0.14);
      --danger-text: #0a0a0a;
      --danger-border: rgba(0, 0, 0, 0.28);
      --scrollbar: rgba(0, 0, 0, 0.2);
      --scrollbar-hover: rgba(0, 0, 0, 0.34);
    }
    html, body {
      width: 380px;
      height: 440px;
      overflow: hidden;
      background: var(--bg);
    }
    #shot {
      width: 380px;
      height: 440px;
      overflow: hidden;
      background: var(--bg);
    }
    #shot #app {
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="shot">
    <div id="app">
      <header class="titlebar">
        <div class="brand">
          <svg class="brand-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="6" rx="2" />
            <rect x="3" y="14" width="18" height="6" rx="2" />
            <circle cx="7" cy="7" r="1" fill="currentColor" stroke="none" />
            <circle cx="7" cy="17" r="1" fill="currentColor" stroke="none" />
          </svg>
          <h1>LocalStop</h1>
        </div>
        <div class="header-actions">
          <button class="round" type="button" title="Refresh" aria-label="Refresh">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M21 12a9 9 0 1 1-2.64-6.36" />
              <polyline points="21 3 21 9 15 9" />
            </svg>
          </button>
          <button class="round" type="button" title="Quit" aria-label="Quit">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>
      </header>

      <div class="toolbar">
        <input id="search" class="search" type="search" placeholder="Search..." value="" aria-label="Search servers" />
        <button id="sort" class="sort" type="button" title="Change sorting" aria-label="Change sorting">
          <span id="sort-label">Sort: Port</span>
        </button>
      </div>

      <main id="list" class="list">
        <div class="row">
          <span class="badge">3000</span>
          <div class="text">
            <div class="name">portfolio</div>
            <div class="detail">node · PID 48213</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 3000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 3000 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 3000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="badge">5173</span>
          <div class="text">
            <div class="name">storefront</div>
            <div class="detail">vite · PID 48302</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 5173">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 5173 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 5173">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="badge">8000</span>
          <div class="text">
            <div class="name">api</div>
            <div class="detail">python3 · PID 48377</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 8000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 8000 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 8000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="badge">8080</span>
          <div class="text">
            <div class="name">docs</div>
            <div class="detail">ruby · PID 48410</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 8080">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 8080 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 8080">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="badge">5432</span>
          <div class="text">
            <div class="name">postgres</div>
            <div class="detail">postgres · PID 47110</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 5432">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 5432 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 5432">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>

        <div class="row">
          <span class="badge">9000</span>
          <div class="text">
            <div class="name">worker</div>
            <div class="detail">go · PID 48455</div>
          </div>
          <div class="actions">
            <button class="icon pencil" type="button" title="Rename" aria-label="Rename port 9000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon open" type="button" title="Open in browser" aria-label="Open port 9000 in browser">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
            </button>
            <button class="icon stop" type="button" title="Stop" aria-label="Stop port 9000">
              <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>
</body>
</html>
