[package]
name = "localstop"
version = "0.1.1"
description = "List and stop localhost dev servers"
authors = ["LocalStop"]
edition = "2021"

[lib]
name = "localstop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
